[project]
name = "colorful-log"
version = "0.3.1"
description = "tools that allow you to manipulate the style of the string"
readme = "README.md"
authors = [
    { name = "Finsa-SC", email = "finsakusumaputra@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.10",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
